name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the documented floor (engines.node); 20/22 are what people run.
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm: this repo ships a pnpm lockfile. The two lockfiles used
      # to disagree — npm resolved @modelcontextprotocol/sdk 1.12.1 against
      # zod 4.4.3, which is the broken pairing this CI now guards against.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate the dependency pairing BEFORE building. Cheap, offline, and it is
      # the check whose absence let a build that starts but cannot serve a
      # single tool call reach a release.
      #
      # Run without --require-build here: dist/ does not exist yet, and the
      # build artefact is reported as a note rather than a failure at this
      # stage. The strict variant runs after the build, below.
      - name: Preflight (dependencies)
        run: pnpm run preflight

      - run: pnpm run build

      # Now dist/ must exist. This is the ordering that matters: preflight
      # before the build gates the dependency pairing, preflight after it
      # confirms the artefact a client would actually be pointed at.
      - name: Preflight (build artefact)
        run: node scripts/preflight.mjs --require-build

      - name: Unit and integration tests
        run: pnpm run test

      # Drive the real protocol over stdio.
      #
      # The upstream version of this step sent only `initialize` and
      # `tools/list`. Both succeed even when every `tools/call` fails, which is
      # exactly how a zod/SDK mismatch shipped looking green. The third message
      # below is the one that matters: it deliberately passes an INVALID
      # argument, so a healthy server answers with a validation error while a
      # server with the broken pairing crashes inside its argument validator.
      # No network is needed to tell those apart.
      - name: Smoke-check MCP handshake and a tool call
        run: |
          set -euo pipefail
          out="$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"book_details","arguments":{"md5":"not-an-md5"}}}' \
            | node dist/index.js)"

          echo "$out" | grep -q search_books || { echo "tools/list did not expose search_books"; exit 1; }

          # The failure signature of the broken zod/SDK pairing.
          if echo "$out" | grep -q "_parse is not a function"; then
            echo "tool call crashed in the argument validator — zod/SDK pairing is broken"
            exit 1
          fi

          # A healthy server rejects the bad md5 with a validation error.
          echo "$out" | grep -q "md5" || { echo "expected a validation error naming md5"; exit 1; }
          echo "handshake + tool-call smoke check passed"

      # The installer is the supported entry point for this fork (it is not
      # published to npm), so a broken installer is a broken install path.
      # Dry run only: CI must not clone or write configs.
      - name: Installer dry run
        run: node scripts/install.mjs --dry-run

      # Prove the startup guard actually refuses a server that cannot serve.
      # The real broken pairing (sdk 1.12.1 + zod 4) is exercised in a throwaway
      # tree, because the point is to show what a user with that install sees.
      - name: Startup guard rejects the broken zod/SDK pairing
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/broken-pairing' EXIT
          mkdir -p /tmp/broken-pairing
          cd /tmp/broken-pairing
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund \
            @modelcontextprotocol/sdk@1.12.1 zod@4.4.3 cheerio@1.0.0 >/dev/null
          node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p))"
          cp -r "$OLDPWD/dist" ./dist

          set +e
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | node dist/index.js > out.txt 2> err.txt
          code=$?
          set -e

          # It must refuse, non-zero, and say what to do.
          [ "$code" -ne 0 ] || { echo "server started despite the broken pairing"; cat err.txt; exit 1; }
          grep -q "refusing to start" err.txt || { echo "no clear refusal on stderr"; cat err.txt; exit 1; }
          grep -q "@modelcontextprotocol/sdk" err.txt || { echo "the fix is not named"; cat err.txt; exit 1; }
          echo "startup guard correctly refused the broken pairing (exit $code)"
